
name: Titanic MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

#      - name: Restore DVC data
#        run: dvc pull

      - name: Run preprocessing tests
        run: python -m pytest tests/test_preprocess.py -v

      - name: Run preprocessing
        run: python -m src.preprocess

      - name: Configure MLflow
        run: |
          echo "MLFLOW_TRACKING_URI=sqlite:///mlflow.db" >> "$GITHUB_ENV"

      - name: Train models
        run: python -m src.train

      - name: Run model tests
        run: python -m pytest tests/test_model.py -v

      - name: Evaluate model
        env:
          MPLBACKEND: Agg
        run: python -m src.evaluate

      - name: Test FastAPI endpoints
        run: python -m pytest tests/test_api.py -v

      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: titanic-model-results
          path: |
            models/best_model.pkl
            reports/
          retention-days: 7
